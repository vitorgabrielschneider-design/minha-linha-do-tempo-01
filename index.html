<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linha do Tempo do Vitor</title>
<style>
:root{--bg:#050505;--ink:#303a40;--orange:#ff5a00;--yellow:#c8c515;--pink:#e982b2;--blue:#55b7d9;--green:#55bcae}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Arial,Helvetica,sans-serif}.screen{width:min(650px,100vw);min-height:100vh;margin:auto;background:linear-gradient(90deg,#050505,#111 48%,#050505)}.home{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:30px 24px;text-align:center}.home-card{width:min(590px,100%)}.home h1{margin:0;color:var(--orange);font-family:"Arial Black",Impact,Haettenschweiler,sans-serif;font-size:clamp(3.7rem,13vw,7.5rem);line-height:.82;letter-spacing:-.09em;text-transform:uppercase;text-shadow:7px 7px 0 #ff9a49,10px 10px 0 #171717;transform:rotate(-3deg);-webkit-text-stroke:5px #171717;paint-order:stroke fill}.start{margin-top:46px;border:4px solid #172333;border-radius:5px;padding:14px 38px;color:#fff;background:var(--orange);box-shadow:5px 5px 0 #172333;font-size:.95rem;font-weight:900;text-transform:uppercase;transition:.2s}.start:hover{background:#ff7b2d;transform:translate(-2px,-2px);box-shadow:7px 7px 0 #172333}.home-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:46px}.home-actions .start{margin-top:0}.game-view{display:none;min-height:100vh;padding:35px 18px;color:#fff;text-align:center}.game-view.visible{display:block}.game-head{display:flex;justify-content:space-between;align-items:center;max-width:360px;margin:0 auto 12px;font-size:.8rem;font-weight:900}.game-head strong{color:var(--orange);font-size:1.2rem}.game-board{position:relative;width:min(440px,100%);height:680px;margin:auto;overflow:hidden;border:4px solid #ff5a00;border-radius:8px;background:radial-gradient(circle at 50% 20%,#252525,#080808 70%);box-shadow:0 0 0 5px #171717,0 12px 25px #000}.game-board:before{content:"✦  ·  ✧    ·  ✦     ·   ✧  ·  ✦";position:absolute;top:25px;left:0;width:100%;color:#ffffff55;font-size:1.15rem;letter-spacing:16px}.player{position:absolute;bottom:18px;left:50%;z-index:3;width:48px;height:48px;border:3px solid #171717;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px #ff9a49,0 5px 0 #000;transform:translateX(-50%);transition:left .08s}.player:after{content:"★";display:grid;place-items:center;height:100%;color:#fff;font-size:1.5rem}.obstacle{position:absolute;top:-48px;width:35px;height:35px;border:3px solid #171717;border-radius:7px;background:var(--pink);box-shadow:0 0 0 3px #f4accb}.game-message{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;background:#000b}.game-message h2{margin:0;color:var(--orange);font-size:2rem}.game-message p{max-width:260px;color:#ddd;font-size:.8rem;line-height:1.5}.game-controls{display:flex;justify-content:center;gap:18px;margin:15px auto 0}.game-control,.game-back{border:2px solid #fff;border-radius:4px;padding:10px 18px;color:#fff;background:#222;font-weight:900}.game-control{font-size:1.1rem}.game-back{margin-top:15px;font-size:.72rem}.game-control:active,.game-back:hover{background:var(--orange)}.timeline-view{display:none;position:relative;min-height:100vh;padding:18px 0 30px;overflow:hidden}.timeline-view.visible{display:block}.back{position:absolute;top:19px;left:20px;z-index:5;border:0;color:#707a7e;background:transparent;font-size:.7rem;font-weight:700}.back:hover{color:var(--ink)}.timeline{position:relative;width:100%;height:1800px;min-height:1800px;margin-top:28px;overflow:hidden}.timeline svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.path{fill:none;stroke:var(--ink);stroke-width:1.45}.path-light{fill:none;stroke:#fff;stroke-width:.8;opacity:.95}.item{position:absolute;z-index:2;width:190px;transform:translate(-50%,-50%)}.item:nth-child(1){left:17%;top:92%}.item:nth-child(2){left:62%;top:82%}.item:nth-child(3){left:45%;top:72%}.item:nth-child(4){left:73%;top:62%}.item:nth-child(5){left:34%;top:52%}.item:nth-child(6){left:74%;top:42%}.item:nth-child(7){left:28%;top:32%}.item:nth-child(8){left:73%;top:22%}.item:nth-child(9){left:45%;top:12%}.item:nth-child(10){left:78%;top:3%}.bubble{display:flex;position:relative;flex-direction:column;align-items:center;justify-content:center;width:174px;height:174px;margin:auto;padding:20px;border-radius:50%;color:#fff;text-align:center;background:var(--accent);box-shadow:0 8px 13px rgba(67,74,77,.18)}.bubble:after{content:"";position:absolute;bottom:-49px;left:50%;width:4px;height:53px;background:var(--accent);transform:translateX(-50%)}.item:last-child .bubble:after{display:none}.bubble h2{margin:0 0 5px;font-size:2.45rem;line-height:.9;font-weight:800;letter-spacing:-.06em}.bubble h3{margin:0;font-size:.76rem;line-height:1.25;font-weight:800}.bubble p{margin:6px 0 0;font-size:.58rem;line-height:1.3}.enter-moment{margin-top:8px;padding:5px 12px;border:2px solid #fff;border-radius:999px;color:#fff;background:transparent;font-size:.58rem;font-weight:900;opacity:0;transform:translateY(5px);transition:.2s}.bubble:hover .enter-moment,.enter-moment:focus{opacity:1;transform:translateY(0);background:#ffffff33}.moment-modal{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:22px;background:#000b}.moment-modal.open{display:flex}.moment-modal-card{position:relative;width:min(390px,100%);padding:30px 24px;border:4px solid #171717;border-radius:8px;color:#fff;background:var(--accent,#f56a20);box-shadow:8px 8px 0 #000}.moment-modal-card h2{margin:0;font-size:3.2rem;line-height:.9}.moment-modal-card h3{margin:10px 0 0;font-size:1.15rem}.moment-modal-card p{margin:12px 0 22px;line-height:1.5}.close-modal{border:2px solid #fff;border-radius:4px;padding:9px 16px;color:#fff;background:transparent;font-weight:900}.close-modal:hover{background:#ffffff33}.dot{position:absolute;top:50%;left:50%;z-index:3;width:12px;height:12px;border:3px solid var(--bg);border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}@media(max-width:520px){.timeline{height:1500px;min-height:1500px}.item{width:146px}.bubble{width:139px;height:139px;padding:13px}.bubble h2{font-size:1.95rem}.bubble h3{font-size:.64rem}.bubble p{font-size:.49rem}.item:nth-child(1){left:18%;top:92%}.item:nth-child(2){left:68%;top:82%}.item:nth-child(3){left:43%;top:72%}.item:nth-child(4){left:75%;top:62%}.item:nth-child(5){left:34%;top:52%}.item:nth-child(6){left:74%;top:42%}.item:nth-child(7){left:28%;top:32%}.item:nth-child(8){left:73%;top:22%}.item:nth-child(9){left:45%;top:12%}.item:nth-child(10){left:78%;top:3%}}
</style>
</head>
<body>
<div class="screen">
<section class="home" id="home" aria-label="Aba inicial"><div class="home-card"><h1>Linha do<br>Tempo do Vitor</h1><div class="home-actions"><button class="start" id="startButton" type="button">Entrar</button><button class="start" id="gameButton" type="button" onclick="document.getElementById('home').style.display='none';document.getElementById('gameView').classList.add('visible')">Mini game</button></div></div></section>
<section class="game-view" id="gameView" aria-label="Mini game"><div class="game-head"><span>Vidas: <strong id="lives">♥♥</strong></span><span>Nível: <strong id="level">1</strong></span><span>R$ <strong id="money">0</strong></span><span>Pontos: <strong id="score">0</strong></span></div><div class="game-board" id="gameBoard"><div class="player" id="player"></div><div class="game-message" id="gameMessage"><h2>Mini game</h2><p>Use as setas, A/D ou os botões para mover o personagem e desviar dos blocos.</p><button class="start" id="playButton" type="button">Começar</button></div></div><div class="game-controls"><button class="game-control" id="leftButton" type="button">←</button><button class="game-control" id="rightButton" type="button">→</button></div><button class="game-back" id="gameBackButton" type="button">← voltar à aba inicial</button></section>
<section class="timeline-view" id="timelineView" aria-label="Linha do tempo"><button class="back" id="backButton" type="button">← aba inicial</button><main class="timeline"><svg viewBox="0 0 620 990" preserveAspectRatio="none" aria-hidden="true"><path class="path-light" d="M-20 900 C180 900 300 850 420 830 C540 810 575 755 470 700 C365 645 150 680 150 590 C150 510 395 535 475 465 C555 395 425 320 260 330 C110 340 82 265 245 230 C400 197 575 240 625 162 C655 112 585 67 480 78"/><path class="path" d="M-20 898 C180 898 300 848 420 828 C540 808 575 753 470 698 C365 643 150 678 150 588 C150 508 395 533 475 463 C555 393 425 318 260 328 C110 338 82 263 245 228 C400 195 575 238 625 160 C655 110 585 65 480 76"/></svg><div id="items"></div></main></section>
</div><div class="moment-modal" id="momentModal" role="dialog" aria-modal="true" aria-labelledby="modalYear"><div class="moment-modal-card" id="modalCard"><h2 id="modalYear"></h2><h3 id="modalTitle"></h3><p id="modalText"></p><button class="close-modal" id="closeModal" type="button">Voltar à linha do tempo</button></div></div>
<script>
(()=>{const moments=[{year:'1970',title:'O começo',text:'A primeira página da minha história foi escrita.',color:'#f56a20'},{year:'1980',title:'Uma conquista',text:'Um passo importante mostrou que novos caminhos eram possíveis.',color:'#c8c515'},{year:'1990',title:'Uma nova fase',text:'Uma mudança trouxe aprendizados e novas escolhas.',color:'#e982b2'},{year:'2010',title:'Um sonho ganhou forma',text:'Uma ideia começou a se tornar realidade.',color:'#55b7d9'},{year:'2020',title:'Cheguei até aqui',text:'Olhar para trás revela força e crescimento.',color:'#55bcae'},{year:'1975',title:'Primeiras descobertas',text:'Novas experiências começaram a formar minha personalidade.',color:'#ff8b3d'},{year:'1985',title:'Um novo desafio',text:'Aprendi a transformar obstáculos em movimento.',color:'#e3dc31'},{year:'1995',title:'Pessoas importantes',text:'Encontros especiais deixaram marcas na minha caminhada.',color:'#f1a6c8'},{year:'2000',title:'Uma escolha',text:'Uma decisão abriu espaço para uma nova direção.',color:'#78cbe5'},{year:'2015',title:'Mais um passo',text:'Continuei seguindo em frente, levando cada aprendizado comigo.',color:'#7ed1c0'}];document.getElementById('items').innerHTML=moments.map(m=>`<article class="item" style="--accent:${m.color}"><span class="dot"></span><div class="bubble"><h2>${m.year}</h2><button class="enter-moment" type="button" data-year="${m.year}">Entrar</button></div></article>`).join('');const modal=document.getElementById('momentModal'),modalCard=document.getElementById('modalCard'),modalYear=document.getElementById('modalYear'),modalTitle=document.getElementById('modalTitle'),modalText=document.getElementById('modalText');document.querySelectorAll('.enter-moment').forEach(button=>button.addEventListener('click',()=>{const moment=moments.find(m=>m.year===button.dataset.year);if(!moment)return;modalYear.textContent=moment.year;modalTitle.textContent=moment.title;modalText.textContent=moment.text;modalCard.style.setProperty('--accent',moment.color);modal.classList.add('open')}));document.getElementById('closeModal').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',event=>{if(event.target===modal)modal.classList.remove('open')});const home=document.getElementById('home'),timeline=document.getElementById('timelineView');document.getElementById('startButton').addEventListener('click',()=>{home.style.display='none';timeline.classList.add('visible');window.scrollTo(0,0)});document.getElementById('backButton').addEventListener('click',()=>{timeline.classList.remove('visible');home.style.display='flex';window.scrollTo(0,0)});const game=document.getElementById('gameView'),board=document.getElementById('gameBoard'),player=document.getElementById('player'),message=document.getElementById('gameMessage'),scoreEl=document.getElementById('score');let playing=false,score=0,lives=2,level=1,money=Number(localStorage.getItem('vitorMiniGameMoney')||0),playerX=50,obstacles=[],last=0,spawn=0,frame;function showGame(){home.style.display='none';game.classList.add('visible');window.scrollTo(0,0)}function move(dir){if(!playing)return;playerX=Math.max(9,Math.min(91,playerX+dir*13));player.style.left=playerX+'%'}function updateHud(){document.getElementById('lives').textContent='♥'.repeat(lives)+'♡'.repeat(2-lives);document.getElementById('level').textContent=level;document.getElementById('money').textContent=money}function resetGame(){obstacles.forEach(o=>o.el.remove());obstacles=[];score=0;lives=2;level=1;playerX=50;scoreEl.textContent='0';player.style.left='50%';updateHud();message.innerHTML='<h2>Mini game</h2><p>Desvie dos blocos e faça a maior pontuação!</p><button class="start" id="playButton" type="button">Começar</button>';message.style.display='flex';document.getElementById('playButton').addEventListener('click',startGame)}function startGame(){obstacles.forEach(o=>o.el.remove());obstacles=[];playing=true;lives=2;level=1;score=0;scoreEl.textContent='0';updateHud();message.style.display='none';last=performance.now();spawn=0;cancelAnimationFrame(frame);frame=requestAnimationFrame(loop)}function endGame(){playing=false;const reward=10+score*2+level*5;money+=reward;localStorage.setItem('vitorMiniGameMoney',money);message.innerHTML='<h2>GAME OVER</h2><p>Você fez <strong>'+score+' pontos</strong> e chegou ao nível <strong>'+level+'</strong>.</p><p style="color:#ffd34d;font-size:1.15rem">Recompensa: <strong>R$ '+reward+'</strong></p><button class="start" id="playButton" type="button">Jogar novamente</button>';updateHud();message.style.display='flex';document.getElementById('playButton').addEventListener('click',startGame)}function loop(now){if(!playing)return;const dt=Math.min(40,now-last);last=now;spawn+=dt;if(spawn>720){spawn=0;const el=document.createElement('div');el.className='obstacle';const x=8+Math.random()*84;el.style.left=x+'%';board.appendChild(el);obstacles.push({el,x,y:-48});}const pRect=player.getBoundingClientRect();obstacles=obstacles.filter(o=>{o.y+=dt*.22;o.el.style.top=o.y+'px';const r=o.el.getBoundingClientRect();if(r.bottom>pRect.top+5&&r.top<pRect.bottom-5&&r.right>pRect.left+5&&r.left<pRect.right-5){o.el.remove();lives--;updateHud();if(lives<=0)endGame();return false}if(o.y>700){o.el.remove();score++;level=1+Math.floor(score/5);scoreEl.textContent=score;updateHud();return false}return true});frame=requestAnimationFrame(loop)}document.getElementById('gameButton').addEventListener('click',showGame);document.getElementById('gameBackButton').addEventListener('click',()=>{playing=false;game.classList.remove('visible');home.style.display='flex';resetGame()});document.getElementById('playButton').addEventListener('click',startGame);document.getElementById('leftButton').addEventListener('click',()=>move(-1));document.getElementById('rightButton').addEventListener('click',()=>move(1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1)});resetGame()})()
</script>
</body>
</html>
