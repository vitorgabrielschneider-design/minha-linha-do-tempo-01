<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linha do Tempo do Vitor</title>
<style>
:root{--bg:#050505;--ink:#303a40;--orange:#ff5a00;--yellow:#c8c515;--pink:#e982b2;--blue:#55b7d9;--green:#55bcae}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Arial,Helvetica,sans-serif}.screen{width:min(650px,100vw);min-height:100vh;margin:auto;background:linear-gradient(90deg,#050505,#111 48%,#050505)}.home{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:30px 24px;text-align:center}.home-card{width:min(590px,100%)}.home h1{margin:0;color:var(--orange);font-family:"Arial Black",Impact,Haettenschweiler,sans-serif;font-size:clamp(3.7rem,13vw,7.5rem);line-height:.82;letter-spacing:-.09em;text-transform:uppercase;text-shadow:7px 7px 0 #ff9a49,10px 10px 0 #171717;transform:rotate(-3deg);-webkit-text-stroke:5px #171717;paint-order:stroke fill}.start{margin-top:46px;border:4px solid #172333;border-radius:5px;padding:14px 38px;color:#fff;background:var(--orange);box-shadow:5px 5px 0 #172333;font-size:.95rem;font-weight:900;text-transform:uppercase;transition:.2s}.start:hover{background:#ff7b2d;transform:translate(-2px,-2px);box-shadow:7px 7px 0 #172333}.home-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:46px}.home-actions .start{margin-top:0}.timeline-view{display:none;position:relative;min-height:100vh;padding:18px 0 30px;overflow:hidden}.timeline-view.visible{display:block}.back{position:absolute;top:19px;left:20px;z-index:5;border:0;color:#707a7e;background:transparent;font-size:.7rem;font-weight:700}.back:hover{color:var(--ink)}.timeline-tools{position:absolute;top:14px;right:18px;z-index:6}.timeline-tools button,.edit-moment{border:2px solid #fff;border-radius:999px;padding:7px 11px;color:#fff;background:#000b;font-size:.58rem;font-weight:900;text-transform:uppercase;cursor:pointer}.timeline-tools button:hover,.edit-moment:hover{background:var(--orange)}.timeline{position:relative;width:100%;height:1800px;min-height:1800px;margin-top:28px;overflow:hidden}.timeline svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.path{fill:none;stroke:var(--ink);stroke-width:1.45}.path-light{fill:none;stroke:#fff;stroke-width:.8;opacity:.95}.item{position:absolute;z-index:2;width:190px;transform:translate(-50%,-50%)}.item:nth-child(1){left:17%;top:92%}.item:nth-child(2){left:62%;top:82%}.item:nth-child(3){left:45%;top:72%}.item:nth-child(4){left:73%;top:62%}.item:nth-child(5){left:34%;top:52%}.item:nth-child(6){left:74%;top:42%}.item:nth-child(7){left:28%;top:32%}.item:nth-child(8){left:73%;top:22%}.item:nth-child(9){left:45%;top:12%}.item:nth-child(10){left:78%;top:3%}.bubble{display:flex;position:relative;flex-direction:column;align-items:center;justify-content:center;width:174px;height:174px;margin:auto;padding:20px;border-radius:50%;color:#fff;text-align:center;background:var(--accent);box-shadow:0 8px 13px rgba(67,74,77,.18)}.bubble:after{content:"";position:absolute;bottom:-49px;left:50%;width:4px;height:53px;background:var(--accent);transform:translateX(-50%)}.item:last-child .bubble:after{display:none}.bubble h2{margin:0 0 5px;font-size:2.45rem;line-height:.9;font-weight:800;letter-spacing:-.06em}.bubble h3{margin:0;font-size:.76rem;line-height:1.25;font-weight:800}.bubble p{margin:6px 0 0;font-size:.58rem;line-height:1.3}.enter-moment{margin-top:8px;padding:5px 12px;border:2px solid #fff;border-radius:999px;color:#fff;background:transparent;font-size:.58rem;font-weight:900;opacity:0;transform:translateY(5px);transition:.2s}.edit-moment{margin-top:5px;padding:4px 9px;font-size:.5rem;opacity:0;transform:translateY(5px);transition:.2s}.bubble:hover .enter-moment,.bubble:hover .edit-moment,.enter-moment:focus,.edit-moment:focus{opacity:1;transform:translateY(0);background:#ffffff33}.moment-modal{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;padding:22px;background:#000b}.moment-modal.open{display:flex}.moment-modal-card{position:relative;width:min(390px,100%);padding:30px 24px;border:4px solid #171717;border-radius:8px;color:#fff;background:var(--accent,#f56a20);box-shadow:8px 8px 0 #000}.moment-modal-card h2{margin:0;font-size:3.2rem;line-height:.9}.moment-modal-card h3{margin:10px 0 0;font-size:1.15rem}.moment-modal-card p{margin:12px 0 22px;line-height:1.5}.close-modal{border:2px solid #fff;border-radius:4px;padding:9px 16px;color:#fff;background:transparent;font-weight:900}.close-modal:hover{background:#ffffff33}.editor-modal{display:none;position:fixed;inset:0;z-index:25;align-items:center;justify-content:center;padding:22px;background:#000b}.editor-modal.open{display:flex}.editor-card{width:min(410px,100%);padding:25px 22px;border:4px solid #171717;border-radius:8px;color:#fff;background:#151515;box-shadow:8px 8px 0 #000}.editor-card h2{margin:0 0 16px;color:var(--orange);font-size:1.6rem}.editor-card label{display:block;margin:10px 0;text-align:left;font-size:.7rem;font-weight:900;text-transform:uppercase}.editor-card input,.editor-card textarea{display:block;width:100%;margin-top:5px;padding:10px;border:2px solid #555;border-radius:4px;color:#fff;background:#292929;font:inherit}.editor-card textarea{min-height:90px;resize:vertical}.editor-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.editor-actions button{margin:0}.dot{position:absolute;top:50%;left:50%;z-index:3;width:12px;height:12px;border:3px solid var(--bg);border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}@media(max-width:520px){.timeline{height:1500px;min-height:1500px}.item{width:146px}.bubble{width:139px;height:139px;padding:13px}.bubble h2{font-size:1.95rem}.bubble h3{font-size:.64rem}.bubble p{font-size:.49rem}.item:nth-child(1){left:18%;top:92%}.item:nth-child(2){left:68%;top:82%}.item:nth-child(3){left:43%;top:72%}.item:nth-child(4){left:75%;top:62%}.item:nth-child(5){left:34%;top:52%}.item:nth-child(6){left:74%;top:42%}.item:nth-child(7){left:28%;top:32%}.item:nth-child(8){left:73%;top:22%}.item:nth-child(9){left:45%;top:12%}.item:nth-child(10){left:78%;top:3%}}
</style>
</head>
<body>
<div class="screen">
<section class="home" id="home" aria-label="Aba inicial"><div class="home-card"><h1>Linha do<br>Tempo do Vitor</h1><div class="home-actions"><button class="start" id="startButton" type="button">Entrar</button></div></div></section>
<section class="timeline-view" id="timelineView" aria-label="Linha do tempo"><button class="back" id="backButton" type="button">← aba inicial</button><div class="timeline-tools"><button id="addMomentButton" type="button">+ adicionar momento</button></div><main class="timeline"><svg viewBox="0 0 620 990" preserveAspectRatio="none" aria-hidden="true"><path class="path-light" d="M-20 900 C180 900 300 850 420 830 C540 810 575 755 470 700 C365 645 150 680 150 590 C150 510 395 535 475 465 C555 395 425 320 260 330 C110 340 82 265 245 230 C400 197 575 240 625 162 C655 112 585 67 480 78"/><path class="path" d="M-20 898 C180 898 300 848 420 828 C540 808 575 753 470 698 C365 643 150 678 150 588 C150 508 395 533 475 463 C555 393 425 318 260 328 C110 338 82 263 245 228 C400 195 575 238 625 160 C655 110 585 65 480 76"/></svg><div id="items"></div></main></section>
</div><div class="moment-modal" id="momentModal" role="dialog" aria-modal="true" aria-labelledby="modalYear"><div class="moment-modal-card" id="modalCard"><h2 id="modalYear"></h2><h3 id="modalTitle"></h3><p id="modalText"></p><button class="close-modal" id="closeModal" type="button">Voltar à linha do tempo</button></div></div><div class="editor-modal" id="editorModal" role="dialog" aria-modal="true" aria-labelledby="editorHeading"><form class="editor-card" id="editorForm"><h2 id="editorHeading">Editar momento</h2><label>Ano<input id="editorYear" required maxlength="12"></label><label>Título<input id="editorTitle" required maxlength="60"></label><label>Descrição<textarea id="editorText" required maxlength="220"></textarea></label><label>Cor<input id="editorColor" type="color" value="#f56a20"></label><div class="editor-actions"><button class="close-modal" id="cancelEdit" type="button">Cancelar</button><button class="start" type="submit">Salvar</button></div></form></div>
<script>
(()=>{
const defaultMoments=[{year:'1970',title:'O começo',text:'A primeira página da minha história foi escrita.',color:'#f56a20'},{year:'1980',title:'Uma conquista',text:'Um passo importante mostrou que novos caminhos eram possíveis.',color:'#c8c515'},{year:'1990',title:'Uma nova fase',text:'Uma mudança trouxe aprendizados e novas escolhas.',color:'#e982b2'},{year:'2010',title:'Um sonho ganhou forma',text:'Uma ideia começou a se tornar realidade.',color:'#55b7d9'},{year:'2020',title:'Cheguei até aqui',text:'Olhar para trás revela força e crescimento.',color:'#55bcae'},{year:'1975',title:'Primeiras descobertas',text:'Novas experiências começaram a formar minha personalidade.',color:'#ff8b3d'},{year:'1985',title:'Um novo desafio',text:'Aprendi a transformar obstáculos em movimento.',color:'#e3dc31'},{year:'1995',title:'Pessoas importantes',text:'Encontros especiais deixaram marcas na minha caminhada.',color:'#f1a6c8'},{year:'2000',title:'Uma escolha',text:'Uma decisão abriu espaço para uma nova direção.',color:'#78cbe5'},{year:'2015',title:'Mais um passo',text:'Continuei seguindo em frente, levando cada aprendizado comigo.',color:'#7ed1c0'}];
let moments=defaultMoments;try{const saved=JSON.parse(localStorage.getItem('vitorTimelineMoments')||'null');if(Array.isArray(saved)&&saved.length)moments=saved}catch(error){}
const items=document.getElementById('items'),timelineCanvas=document.querySelector('.timeline'),positions=[18,68,43,75,34,74,28,73,45,78];
function saveMoments(){localStorage.setItem('vitorTimelineMoments',JSON.stringify(moments))}
function renderMoments(){items.innerHTML='';const height=Math.max(1800,moments.length*175);timelineCanvas.style.height=height+'px';timelineCanvas.style.minHeight=height+'px';moments.forEach((moment,index)=>{const article=document.createElement('article');article.className='item';article.style.left=positions[index%positions.length]+'%';article.style.top=(height-125-index*170)+'px';article.style.setProperty('--accent',moment.color||'#f56a20');const dot=document.createElement('span');dot.className='dot';const bubble=document.createElement('div');bubble.className='bubble';const year=document.createElement('h2');year.textContent=moment.year;const enter=document.createElement('button');enter.className='enter-moment';enter.type='button';enter.dataset.action='open';enter.dataset.index=index;enter.textContent='Entrar';const edit=document.createElement('button');edit.className='edit-moment';edit.type='button';edit.dataset.action='edit';edit.dataset.index=index;edit.textContent='Editar';bubble.append(year,enter,edit);article.append(dot,bubble);items.append(article)})}
const modal=document.getElementById('momentModal'),modalCard=document.getElementById('modalCard'),modalYear=document.getElementById('modalYear'),modalTitle=document.getElementById('modalTitle'),modalText=document.getElementById('modalText');
function openMoment(index){const moment=moments[index];if(!moment)return;modalYear.textContent=moment.year;modalTitle.textContent=moment.title;modalText.textContent=moment.text;modalCard.style.setProperty('--accent',moment.color);modal.classList.add('open')}
const editorModal=document.getElementById('editorModal'),editorForm=document.getElementById('editorForm'),editorYear=document.getElementById('editorYear'),editorTitle=document.getElementById('editorTitle'),editorText=document.getElementById('editorText'),editorColor=document.getElementById('editorColor');let editingIndex=null;
function openEditor(index=null){editingIndex=index;const moment=index===null?{year:'',title:'',text:'',color:'#f56a20'}:moments[index];document.getElementById('editorHeading').textContent=index===null?'Adicionar momento':'Editar momento';editorYear.value=moment.year;editorTitle.value=moment.title;editorText.value=moment.text;editorColor.value=moment.color||'#f56a20';editorModal.classList.add('open');editorYear.focus()}
items.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const index=Number(button.dataset.index);if(button.dataset.action==='open')openMoment(index);if(button.dataset.action==='edit')openEditor(index)});
document.getElementById('addMomentButton').addEventListener('click',()=>openEditor());editorForm.addEventListener('submit',event=>{event.preventDefault();const value={year:editorYear.value.trim(),title:editorTitle.value.trim(),text:editorText.value.trim(),color:editorColor.value};if(!value.year||!value.title||!value.text)return;if(editingIndex===null)moments.push(value);else moments[editingIndex]=value;saveMoments();renderMoments();editorModal.classList.remove('open')});document.getElementById('cancelEdit').addEventListener('click',()=>editorModal.classList.remove('open'));editorModal.addEventListener('click',event=>{if(event.target===editorModal)editorModal.classList.remove('open')});document.getElementById('closeModal').addEventListener('click',()=>modal.classList.remove('open'));modal.addEventListener('click',event=>{if(event.target===modal)modal.classList.remove('open')});
const home=document.getElementById('home'),timeline=document.getElementById('timelineView');document.getElementById('startButton').addEventListener('click',()=>{const senha=window.prompt('Digite a senha para entrar na linha do tempo:');if(senha==='338787'){home.style.display='none';timeline.classList.add('visible');window.scrollTo(0,0)}else if(senha!==null){window.alert('Senha incorreta. Tente novamente')}});document.getElementById('backButton').addEventListener('click',()=>{timeline.classList.remove('visible');home.style.display='flex';window.scrollTo(0,0)});renderMoments()
})()

</script>
</body>
</html>
