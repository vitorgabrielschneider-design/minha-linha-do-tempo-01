<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linha do Tempo</title>
<style>
:root{--bg:#f1f1ef;--orange:#f56a20;--yellow:#c8c515;--pink:#e982b2;--blue:#55b7d9;--green:#55bcae}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Arial,Helvetica,sans-serif}.timeline{position:relative;width:min(650px,100vw);height:100vh;min-height:740px;margin:auto;overflow:hidden;background:linear-gradient(90deg,#eeeeec,#f6f6f4 48%,#eeeeec)}.timeline svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.path{fill:none;stroke:#303a40;stroke-width:1.45}.path-light{fill:none;stroke:#fff;stroke-width:.8;opacity:.95}.item{position:absolute;z-index:2;width:190px;transform:translate(-50%,-50%)}.item:nth-child(1){left:17%;top:88%}.item:nth-child(2){left:62%;top:69%}.item:nth-child(3){left:45%;top:49%}.item:nth-child(4){left:73%;top:29%}.item:nth-child(5){left:77%;top:10%}.bubble{display:flex;position:relative;flex-direction:column;align-items:center;justify-content:center;width:174px;height:174px;margin:auto;padding:20px;border-radius:50%;color:#fff;text-align:center;background:var(--accent);box-shadow:0 8px 13px rgba(67,74,77,.18)}.bubble:after{content:"";position:absolute;bottom:-49px;left:50%;width:4px;height:53px;background:var(--accent);transform:translateX(-50%)}.item:last-child .bubble:after{display:none}.bubble h2{margin:0 0 5px;font-size:2.45rem;line-height:.9;font-weight:800;letter-spacing:-.06em}.bubble h3{margin:0;font-size:.76rem;line-height:1.25;font-weight:800}.bubble p{margin:6px 0 0;font-size:.58rem;line-height:1.3}.dot{position:absolute;top:50%;left:50%;z-index:3;width:12px;height:12px;border:3px solid var(--bg);border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
@media(max-width:520px){.timeline{min-height:650px}.item{width:146px}.bubble{width:139px;height:139px;padding:13px}.bubble h2{font-size:1.95rem}.bubble h3{font-size:.64rem}.bubble p{font-size:.49rem}.item:nth-child(1){left:18%;top:88%}.item:nth-child(2){left:68%;top:69%}.item:nth-child(3){left:43%;top:49%}.item:nth-child(4){left:75%;top:29%}.item:nth-child(5){left:78%;top:10%}}
</style>
</head>
<body>
<main class="timeline" aria-label="Linha do tempo pessoal">
<svg viewBox="0 0 620 990" preserveAspectRatio="none" aria-hidden="true"><path class="path-light" d="M-20 900 C180 900 300 850 420 830 C540 810 575 755 470 700 C365 645 150 680 150 590 C150 510 395 535 475 465 C555 395 425 320 260 330 C110 340 82 265 245 230 C400 197 575 240 625 162 C655 112 585 67 480 78"/><path class="path" d="M-20 898 C180 898 300 848 420 828 C540 808 575 753 470 698 C365 643 150 678 150 588 C150 508 395 533 475 463 C555 393 425 318 260 328 C110 338 82 263 245 228 C400 195 575 238 625 160 C655 110 585 65 480 76"/></svg>
<section id="items"></section>
</main>
<script>
(()=>{const moments=[{year:'1970',title:'O começo',text:'A primeira página da minha história foi escrita.',color:'#f56a20'},{year:'1980',title:'Uma conquista',text:'Um passo importante mostrou que novos caminhos eram possíveis.',color:'#c8c515'},{year:'1990',title:'Uma nova fase',text:'Uma mudança trouxe aprendizados e novas escolhas.',color:'#e982b2'},{year:'2010',title:'Um sonho ganhou forma',text:'Uma ideia começou a se tornar realidade.',color:'#55b7d9'},{year:'2020',title:'Cheguei até aqui',text:'Olhar para trás revela força e crescimento.',color:'#55bcae'}];document.getElementById('items').innerHTML=moments.map(m=>`<article class="item" style="--accent:${m.color}"><span class="dot"></span><div class="bubble"><h2>${m.year}</h2><h3>${m.title}</h3><p>${m.text}</p></div></article>`).join('')})()
</script>
</body>
</html>
